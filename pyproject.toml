[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "Implemeneting GPT 2 from scratch."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "tokenizers>=0.23.3",
    "torch>=2.14.0",
    "transformers>=5.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/llm"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]


[[tool.mypy.overrides]]
module = ["datasets", "datasets.*", "sklearn.metrics", "sklearn.metrics.*"]
ignore_missing_imports = true



[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes: undefined names, unused imports, etc.
    "I",    # isort: import sorting
    "UP",   # pyupgrade: modern Python syntax
    "B",    # flake8-bugbear: likely bugs and design issues
]
