[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/llm"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
